# Full stack: ASP.NET Core app + SQL Server 2022.
# Copy .env.example to .env and fill in the values, then run:  docker compose up --build
# App:  http://localhost:8080

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ankavera-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 (shipped in the 2022 image) requires -C to trust the self-signed cert.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankavera-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Point EF at the db service. Encrypt=False + TrustServerCertificate for the dev cert.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=AnkaveraDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      # Real SMTP password comes from .env, never baked into the image.
      EmailSettings__SmtpPass: "${EMAIL_SMTP_PASS}"
      # Admin seed password — app skips seeding the admin if this is empty.
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
