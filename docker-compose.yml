# ASP.NET Core app backed by a file-based SQLite database.
# Copy .env.example to .env and fill in the values, then run:  docker compose up --build
# App:  http://localhost:8080

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankavera-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # SQLite database file lives on a named volume so it survives container restarts.
      ConnectionStrings__DefaultConnection: "Data Source=/data/AnkaveraDB.db"
      # Real SMTP password comes from .env, never baked into the image.
      EmailSettings__SmtpPass: "${EMAIL_SMTP_PASS}"
      # Admin seed password — app skips seeding the admin if this is empty.
      SeedAdmin__Password: "${SEED_ADMIN_PASSWORD}"
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
